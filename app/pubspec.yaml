name: logicclass
description: LogicClass - multi-tenant school management for Philippine schools.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  rxdart: ^0.28.0

  # Formatting
  intl: ^0.19.0

  # Routing
  go_router: ^14.2.0

  # Firebase
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.4
  cloud_firestore: ^5.2.1
  firebase_storage: ^12.1.3
  firebase_messaging: ^15.0.4
  cloud_functions: ^5.0.4
  firebase_analytics: ^11.2.1
  firebase_crashlytics: ^4.0.4
  firebase_app_check: ^0.3.1+4

  # QR
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3

  # Documents
  pdf: ^3.11.1
  printing: ^5.13.1
  excel: ^4.0.6

  # Media
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0
  camera: ^0.11.0+2

  # Notifications
  flutter_local_notifications: ^17.2.2

  # Connectivity / offline
  connectivity_plus: ^6.0.5

  # Browser APIs (Geolocation, for the emergency alert's location).
  # Reached only through lib/core/location/location_probe_factory.dart's
  # conditional export, so it is never compiled into a non-web build.
  web: ^1.1.0

  cupertino_icons: ^1.0.8
  file_picker: ^11.0.2
  # Remembers the demo session across a page reload. Real mode does not
  # need it -- firebase_auth persists its own session -- so this is the
  # only thing in the app that uses it.
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.2
  geolocator: ^14.0.2
  camera_windows: ^0.2.6+4
  zxing2: ^0.2.4
  image: ^4.3.0
  flutter_svg: ^2.3.0
  diacritic: ^0.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mocktail: ^1.0.4
  build_runner: ^2.4.11

flutter:
  uses-material-design: true

  assets:
    - assets/brand/

  # Bundled, not fetched. Flutter's CanvasKit renderer downloads Roboto from
  # fonts.gstatic.com when an app declares no font of its own -- so on a
  # school connection that blocks it, or offline, every glyph in the app
  # silently disappears while the layout stays put. Shipping the three
  # weights the theme actually asks for (400/500/700) costs ~250KB gzipped
  # and makes first paint independent of the network.
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
          weight: 400
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
