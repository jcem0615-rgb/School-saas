<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>LogicClass is offline</title>
  <!--
    Deliberately standalone: no stylesheet, no script, no image, nothing
    from the build. This page is the only thing the service worker
    caches, and anything it referenced would have to be cached too --
    which is how an offline page becomes a stale copy of the app.
  -->
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      box-sizing: border-box;
      background: #101014;
      color: #f2f3f7;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      text-align: center;
    }
    .card { max-width: 22rem; }
    h1 { font-size: 1.35rem; margin: 0 0 .6rem; letter-spacing: -0.4px; }
    p { margin: 0 0 1.4rem; line-height: 1.55; color: #a8adbd; font-size: .95rem; }
    button {
      font: inherit;
      color: #101014;
      background: #f2f3f7;
      border: 0;
      border-radius: 10px;
      padding: .7rem 1.4rem;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>You are offline</h1>
    <p>
      LogicClass needs a connection to show your school&rsquo;s records.
      Reconnect and try again.
    </p>
    <button type="button" onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
