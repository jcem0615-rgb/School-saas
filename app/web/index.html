<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Announcements, grades, attendance and payments for your school, on your phone.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="LogicClass">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>LogicClass</title>
  <meta name="theme-color" content="#101014">
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    // ---- Install the app -------------------------------------------
    //
    // The manifest has always made this installable. What was missing is
    // anything that *asks*: browsers put the affordance in a menu, so a
    // parent told "it works like an app" has no way to find out it does.
    //
    // `beforeinstallprompt` fires once, early -- usually before Flutter
    // has booted -- and is gone unless something calls preventDefault on
    // it. So the page catches it and holds it, and Dart asks the page
    // what it is holding rather than listening itself.
    //
    // Whether the event fires at all is the browser's call, and its
    // criteria vary by version and platform. If it never fires, offer()
    // says 'none' and the app shows no button, which is the right
    // outcome: better nothing than a button that does nothing.
    (function () {
      var held = null;

      window.addEventListener('beforeinstallprompt', function (event) {
        // Without this the browser shows its own mini-infobar and the
        // event is spent; holding it is what lets our own button work.
        event.preventDefault();
        held = event;
      });

      window.addEventListener('appinstalled', function () {
        held = null;
      });

      function standalone() {
        return window.matchMedia('(display-mode: standalone)').matches ||
          // iOS does not implement the display-mode query and reports
          // this instead.
          window.navigator.standalone === true;
      }

      function iOS() {
        var ua = window.navigator.userAgent;
        // iPadOS 13+ identifies as a Mac, and is told apart by having a
        // touch screen -- no desktop Mac reports touch points.
        return /iPhone|iPad|iPod/.test(ua) ||
          (/Macintosh/.test(ua) && window.navigator.maxTouchPoints > 1);
      }

      window.logicClassInstall = {
        offer: function () {
          if (standalone()) return 'none';
          if (held) return 'prompt';
          // Safari on iOS never fires the event and gives no way to
          // trigger the sheet, so the only honest offer is to say where
          // the button is.
          if (iOS()) return 'instructions';
          return 'none';
        },
        show: function () {
          if (!held) return Promise.resolve(false);
          var event = held;
          // Single-use: whatever the answer, the event cannot be fired
          // again, and a button that silently did nothing on the second
          // tap would be worse than one that has gone away.
          held = null;
          event.prompt();
          return event.userChoice.then(function (choice) {
            return choice.outcome === 'accepted';
          }).catch(function () {
            return false;
          });
        }
      };
    })();
  </script>
  <script>
    // Evicts the service worker this site used to register.
    //
    // The build no longer registers one (--pwa-strategy=none in
    // scripts/vercel-build.sh), but that only spares new visitors.
    // Anyone who loaded an earlier build still carries a registered
    // worker, and it keeps serving that build's cached asset list ahead
    // of the network -- so once one entry no longer matches,
    // main.dart.js never runs and the page is white with nothing in the
    // console a visitor would think to look at. A hard reload fixes it;
    // nobody knows to try one. This does it for them, once.
    //
    // Scoped to Flutter's own worker by script URL. firebase-messaging-sw.js
    // is registered by the messaging SDK for web push and has to survive.
    (function () {
      if (!('serviceWorker' in navigator)) return;
      var evicted = false;
      try { evicted = sessionStorage.getItem('flutter-sw-evicted') === '1'; } catch (e) {}
      if (evicted) return;

      navigator.serviceWorker.getRegistrations().then(function (regs) {
        var ours = regs.filter(function (r) {
          var w = r.active || r.installing || r.waiting;
          return w && w.scriptURL.indexOf('flutter_service_worker.js') !== -1;
        });
        if (!ours.length) return;

        return Promise.all(ours.map(function (r) { return r.unregister(); }))
          .then(function () {
            if (!window.caches || !caches.keys) return;
            return caches.keys().then(function (keys) {
              return Promise.all(keys.map(function (k) { return caches.delete(k); }));
            });
          })
          .then(function () {
            // The page in front of the visitor was itself served from
            // that cache, so it has to come again from the network.
            try { sessionStorage.setItem('flutter-sw-evicted', '1'); } catch (e) {}
            location.reload();
          });
      }).catch(function () {
        // A blocked or unavailable service worker API is not a reason to
        // stop the app loading.
      });
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
