# Publishes the web app to Vercel on every push to main.
#
# This was first written on the belief that the Vercel project had no Git
# integration at all. That was wrong: `logicclass` is attached to this
# repository and has been building every push. What it has not been doing
# is *finishing* -- the builds fail, and a failed build leaves the
# previous deployment serving, which is why the site sat on a commit from
# 26 August while main ran twenty-nine ahead of it. "Nothing arrives" and
# "everything arrives and dies in the build container" look identical
# from outside, and only one of them is fixed by adding a workflow.
#
# It is fixed by this one either way, and that is why it stayed. Building
# in CI uses a cached, purpose-built Flutter action instead of cloning
# the SDK into a Vercel build container, which is the part that has to
# survive there and evidently does not. Only finished files are handed
# to Vercel, so nothing about its build image can break a deploy again.
#
# The Vercel CLI is given a token and the ids of the project to publish
# into, which is the supported way to target an existing project without
# `vercel link`.
#
# ## What has to exist before this works
#
# One repository secret, under Settings -> Secrets and variables ->
# Actions:
#
#   VERCEL_TOKEN   vercel.com/account/tokens -> Create Token, scoped to
#                  the account that owns the project.
#
# The two ids below are not secrets -- they are the addresses of the
# thing being deployed to, and Vercel documents them as identifiers
# rather than credentials. Holding one gets you nothing without the
# token. Written here rather than hidden in repository settings because
# a value nobody can see is a value nobody can check when a deploy lands
# somewhere unexpected.
#
# The org id is not on the project's Settings -> General page: a Hobby
# account shows a Project ID and no Team ID, because there is no team.
# It exists all the same, and this is it.
#
# ## Turn Vercel's own Git integration off
#
# Vercel project -> Settings -> Git -> Disconnect. Two reasons, and the
# second is the one that bites:
#
#   * Both would deploy every push, and the site would rebuild twice.
#   * While its builds keep failing, every push sends a failed-build
#     notification for a deploy nobody is waiting on -- and a red mark
#     that is always red is one nobody reads on the day it means
#     something.
#
# The trade is real: the Git integration gives a preview deployment per
# branch and this does not. It is worth having back if somebody works
# out why the SDK install does not survive that build container.
# `vercel.json` and `scripts/vercel-install.sh` stay in the repository
# for exactly that -- they are the Vercel-side build, kept as the way
# back rather than deleted.
name: Deploy web

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'vercel.json'
      - 'scripts/vercel-build.sh'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

# One deploy at a time, and drop any queued behind a newer push: two
# merges a minute apart should not race to decide what production is.
# The in-flight one is left alone rather than cancelled, because a
# half-finished deploy is worse than a redundant one.
concurrency:
  group: deploy-web
  cancel-in-progress: false

env:
  # jcem0615-5649's projects -> logicclass
  VERCEL_ORG_ID: team_13Ys87NDrANbxiOJrc0x48Vj
  VERCEL_PROJECT_ID: prj_2Lpob95pF5VDOpwh6Qm46gUfbai4

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # Checked here rather than left to fail three steps later with
      # something less obvious. A run that spends five minutes building
      # before saying "no token" is five minutes nobody gets back.
      #
      # The message names the three ways a secret that was definitely
      # added is still not here, because "it is not set" on its own sent
      # somebody back to the same screen to add it a second time. The
      # length is printed rather than the value: it separates absent
      # from present-but-blank, and a number is not a token.
      - name: Check the token is set
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "VERCEL_TOKEN length: ${#VERCEL_TOKEN}"
          if [ -n "$VERCEL_TOKEN" ]; then
            echo "Token is visible to this job."
            exit 0
          fi
          echo "::error::VERCEL_TOKEN is empty in this job."
          echo
          echo "If you have already added it, it is one of these three:"
          echo
          echo "  1. It is an ENVIRONMENT secret, not a repository one."
          echo "     Settings -> Secrets and variables -> Actions has two"
          echo "     tabs. Secrets under an environment reach only a job"
          echo "     that declares 'environment:', and this job does not."
          echo "     Move it to Repository secrets, or say which"
          echo "     environment and the job can name it."
          echo
          echo "  2. It went in under Dependabot, or under Variables."
          echo "     Same page, different tab. Neither is readable from"
          echo "     'secrets.' in a workflow."
          echo
          echo "  3. It is on a different repository. This job ran on"
          echo "     $GITHUB_REPOSITORY -- check the secret is on that one."
          echo
          echo "The name must match exactly: VERCEL_TOKEN."
          echo "Create a token at vercel.com/account/tokens."
          exit 1

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.1
          channel: stable
          cache: true

      - run: flutter pub get
        working-directory: app

      # The same script Vercel's own build step would run, rather than a
      # second copy of the flags. It prepends a _flutter directory that
      # does not exist here, which is harmless -- the SDK is already on
      # PATH from the action above -- and that is what lets one script
      # serve both without an `if CI` branch in it.
      #
      # It also carries the two flags this site cannot be built without:
      # --no-web-resources-cdn, so CanvasKit is served from this origin
      # instead of gstatic, and --pwa-strategy=none, so no service worker
      # serves a stale asset list after a redeploy. Both were learned the
      # hard way; see the comments in the script.
      #
      # ## Demo mode, and turning it off
      #
      # The build script defaults to the demo -- an in-memory school with
      # no Firebase behind it -- and that is what this workflow published
      # for its first twenty-four runs. Turning it off is a repository
      # variable rather than an edit here, so going live is not a commit:
      #
      #   Settings -> Secrets and variables -> Actions -> Variables tab
      #
      #     DEMO_MODE                       false
      #     FIREBASE_API_KEY                from the Firebase console,
      #     FIREBASE_APP_ID                 Project settings -> General
      #     FIREBASE_PROJECT_ID             -> Your apps -> Web app
      #     FIREBASE_MESSAGING_SENDER_ID
      #     FIREBASE_STORAGE_BUCKET         optional
      #     FIREBASE_AUTH_DOMAIN            optional, web sign-in needs it
      #
      # Variables and not secrets, deliberately. These are client
      # identifiers: they ship inside every build, Firebase expects them
      # to be public, and what protects the data is firestore.rules and
      # the callables' own checks -- never the obscurity of these
      # strings. See app/lib/firebase_config.dart. Putting them in
      # Variables means anybody debugging a deploy can read the project
      # id that was built against, which is the first thing you want to
      # know when a site comes up pointed at the wrong project.
      #
      # Set DEMO_MODE=false without the four required keys and the build
      # stops at the script's own check, naming what is missing. That is
      # the intended failure: a red run and the previous deployment still
      # serving beats a live site that loads and then dies at sign-in.
      #
      # Vercel's own project environment variables no longer reach this.
      # The build happens here now, not in Vercel's container, so values
      # set over there are read by nothing -- worth knowing, because that
      # is where the script's comments used to send people.
      - name: Build the web app
        env:
          DEMO_MODE: ${{ vars.DEMO_MODE || 'true' }}
          FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ vars.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ vars.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_AUTH_DOMAIN: ${{ vars.FIREBASE_AUTH_DOMAIN }}
        run: bash scripts/vercel-build.sh

      # Deploying built files rather than sources, so Vercel has nothing
      # to install or compile. That means the deployed directory needs
      # its own config: the repository's vercel.json describes how to
      # build from source and is the wrong shape here.
      #
      # The empty install and build commands are not decoration, and
      # leaving them out cost a deploy. A Vercel project remembers the
      # build settings it was given -- this one still carries
      # `bash scripts/vercel-install.sh` from when the Git integration
      # was connected -- and those settings apply to a CLI deploy just as
      # much as to a push. So Vercel took a finished site and tried to
      # build it again, running an install script that is not in a
      # directory of compiled output, and stopped with exit 127. Setting
      # them empty here overrides the project and makes this the static
      # upload it was always meant to be.
      #
      # outputDirectory is "." for the same reason: the uploaded root is
      # already the built site, not a source tree with the site inside
      # it somewhere.
      #
      # The rewrite is the same one as the repository's, and for the same
      # reason -- only extensionless paths fall back to index.html, so a
      # request for main.dart.js can never be answered with HTML, which
      # is the shape a blank page with nothing in the console takes.
      - name: Write the deployment config
        run: |
          cat > app/build/web/vercel.json <<'JSON'
          {
            "framework": null,
            "installCommand": "",
            "buildCommand": "",
            "outputDirectory": ".",
            "rewrites": [
              { "source": "/((?!.*\\.).*)", "destination": "/index.html" }
            ]
          }
          JSON
          echo "--- deployed vercel.json ---"
          cat app/build/web/vercel.json
          python3 -c "import json,sys; json.load(open('app/build/web/vercel.json')); print('valid JSON')"

      - name: Deploy to production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          # --yes so it never waits for a prompt no one is there to
          # answer. VERCEL_ORG_ID and VERCEL_PROJECT_ID, from the env
          # block at the top, are what aim this at the existing project
          # instead of creating a new one beside it.
          url=$(npx --yes vercel@latest deploy app/build/web \
                  --prod --yes --token "$VERCEL_TOKEN")
          echo "Deployed: $url"
          echo "### Deployed to $url" >> "$GITHUB_STEP_SUMMARY"
