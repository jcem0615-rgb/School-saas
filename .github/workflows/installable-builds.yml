# The app on every platform it targets, built where the toolchains are.
#
# Two of the three jobs produce something a person can install; the third
# only proves the code compiles. That is a real distinction and the job
# names do not carry it, so:
#
#   apk      -> installable, published to the demo-apk release
#   windows  -> installable, published to the demo-apk release
#   ios      -> compiled and linked only, nothing published
#
# The APK exists here because the Android SDK cannot be installed
# everywhere the app can be developed -- dl.google.com is unreachable from
# some networks, and the SDK is the one part of the toolchain with no
# mirror. The runner has it preinstalled. Windows binaries can only be
# produced on Windows, and iOS only on macOS, which is the other half of
# the reason all three live here rather than on anybody's machine.
#
# The APK is signed with the debug key (see android/app/build.gradle.kts),
# which is what makes it installable by sideloading. It is NOT a Play Store
# build: replace the signing config with a real upload key before release.
name: Installable builds

# main, since Vercel builds the web app from it and there is no reason for
# the installable builds to trail a different branch. It used to be
# runnable-demo-mode; that branch has caught up to main and stopped being
# a separate line of work.
#
# ## What runs when, and why it is not everything
#
# Only the Linux APK runs on a push. Windows and iOS run when somebody
# asks for them from the Actions tab.
#
# The reason is now speed rather than money. This repository is public,
# so Actions minutes are free -- but a macOS runner still takes the best
# part of an hour on a 45-minute cap, and a merge is not finished until
# its checks are. A Windows binary is a release artefact and "does this
# still build for iOS" is a question whose answer does not change between
# commits; neither is worth waiting on to know whether a merge was good.
#
# It is worth recording what this looked like before the repository went
# public, because the failure was invisible: all three fired on every
# push touching `app/**` -- every feature commit there has ever been --
# at roughly two hundred billed minutes a time, since Windows bills at
# twice the Linux rate and macOS at ten times. Eight merges in a day
# exhausted the monthly allowance, and the first thing to break was the
# *deploy* workflow, which then failed with no runner assigned and no
# step ever running. That looks nothing like a billing problem and cost
# an hour to find.
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/installable-builds.yml'
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      # Java 17: android/app/build.gradle.kts compiles and targets 17, and
      # the Kotlin jvmTarget is pinned to match.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.1
          channel: stable
          cache: true

      # Gradle's own caches, which are the difference between a build
      # that finishes and one that does not.
      #
      # The logs of three killed builds all show the same five minutes
      # between "flutter pub get" finishing and Gradle actually starting:
      # that is the Gradle distribution and every plugin's dependencies
      # being downloaded from scratch, every time. Restoring them turns
      # five minutes of network into seconds of disk, which is the
      # largest single saving available here -- larger than the one
      # gained by dropping two architectures.
      #
      # Keyed on the files that decide what gets resolved, with a loose
      # restore-key so a pubspec change reuses most of the previous cache
      # rather than starting from nothing.
      # restore and save as separate steps, rather than the combined
      # action, because the combined one saves in a post-step that a
      # cancelled job never reaches. Three builds in a row were killed
      # mid-Gradle, so the cache could never populate from them -- the
      # thing meant to stop the build being slow could only be written by
      # a build that was not slow. `always()` covers cancellation, which
      # is what a killed runner produces.
      - uses: actions/cache/restore@v4
        id: gradle-cache
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('app/pubspec.lock', 'app/android/**/*.gradle*', 'app/android/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - run: flutter pub get

      # The suite is the reason to trust the binary this job hands back --
      # a green APK build only proves it compiled.
      - run: flutter test

      # DEMO_MODE is the default in main.dart, but it is passed explicitly
      # so the artifact's contents do not depend on a default changing:
      # this build must be the self-contained one that needs no Firebase
      # project behind it.
      # arm64 only, for a reason that is about this runner rather than
      # about Android. Most of the app is Dart, but the plugins ship
      # native libraries that have to be compiled per architecture, so
      # building all three took roughly three times as long -- about
      # fifteen minutes of Gradle. Two consecutive runs were then killed
      # mid-build with SIGTERM ("The runner has received a shutdown
      # signal", exit 143) at 13m53s and 14m21s, with no compile error
      # and the test suite already green. The last build that succeeded
      # took about fourteen minutes, which is to say it only just made
      # it. One architecture is one native compile, comfortably clear of
      # that ceiling.
      #
      # arm64-v8a is what every Android phone sold since roughly 2015
      # runs, which is everyone this demo is handed to. What is given up
      # is armeabi-v7a for genuinely old handsets and x86_64 for
      # emulators -- and an arm64-only APK does not explain itself on a
      # 32-bit device, it simply reports the package as incompatible, so
      # that is worth knowing before blaming the download.
      # The memory settings are the other half of the fix, and probably
      # the important half.
      #
      # app/android/gradle.properties asks for -Xmx8G with a 4G
      # metaspace. On a developer machine that is fine. On a 16GB runner,
      # once the Gradle daemon, the Kotlin daemon and javac each take
      # their share, it is close enough to the ceiling that the kernel
      # starts killing things -- and a host that OOMs is exactly what
      # produces "The runner has received a shutdown signal" with no
      # error of its own, which is what three builds in a row died with.
      #
      # Overridden here rather than in gradle.properties so a local build
      # keeps the headroom it was given. --no-daemon on top, because a
      # daemon that outlives the build is memory held for nothing in a
      # container that gets thrown away.
      # --split-per-abi as well as --target-platform, which is not
      # redundant: with the target alone the APK came out at 40MB, and
      # with both it is about 31MB for the same single architecture --
      # splitting strips per-ABI resources that a single-target build
      # still carries. Nine megabytes matters to a school on a phone
      # connection.
      #
      # --split-debug-info moves the Dart symbol tables out of the APK
      # into files beside it. They exist only to turn an obfuscated
      # stack trace back into line numbers, which nothing in this
      # pipeline does -- there is no crash reporter consuming them --
      # so in the APK they are a few hundred kilobytes of dead weight
      # on every download. Standard practice for a release build, and
      # it is what takes this one under 30MB.
      - run: flutter build apk --release --split-per-abi --target-platform android-arm64 --split-debug-info=build/debug-info --dart-define=DEMO_MODE=true
        env:
          GRADLE_OPTS: >-
            -Dorg.gradle.jvmargs=-Xmx4g
            -Dorg.gradle.daemon=false
            -Dkotlin.daemon.jvmargs=-Xmx2g

      # Saved even if the build above was killed, which is the whole
      # point of splitting restore from save. Skipped when the restore
      # was an exact hit, since re-saving an identical cache only earns
      # a warning.
      - uses: actions/cache/save@v4
        if: always() && steps.gradle-cache.outputs.cache-primary-key != steps.gradle-cache.outputs.cache-matched-key
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ steps.gradle-cache.outputs.cache-primary-key }}

      - uses: actions/upload-artifact@v4
        with:
          name: logicclass-demo-apk
          path: app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error

      # Also published as a release asset, because an Actions artifact is
      # only reachable as a zip through the Actions UI -- awkward to get
      # onto the phone that is meant to install it. A release asset is a
      # direct .apk link that Android will hand straight to the installer.
      #
      # One rolling tag, clobbered each build, so the download link stays
      # the same instead of moving with every push. The repository is
      # private, so the asset is too: downloading it needs a signed-in
      # GitHub account with access.
      - name: Publish the APK as a release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          out=build/app/outputs/flutter-apk
          # Still named for the architecture: the release page has to say
          # which phones this will install on, and "app-release.apk" says
          # nothing.
          cp "$out/app-arm64-v8a-release.apk" logicclass-demo-arm64.apk

          notes=$(cat <<'TXT'
          Rolling build of the demo-mode app from main.
          Debug-signed for sideloading -- not a Play Store build, and it needs
          Android 7.0 or newer (the APK carries a v2 signature only).

          **logicclass-demo-arm64.apk** is the one to download. It runs on any
          64-bit ARM phone, which is every Android handset sold since roughly
          2015.

          If a very old phone reports the package as "not compatible", that is
          this build being arm64-only rather than anything wrong with the
          download -- a 32-bit build can be produced on request.
          TXT
          )
          gh release view demo-apk >/dev/null 2>&1 || gh release create demo-apk \
            --target "$GITHUB_SHA" \
            --title "LogicClass demo builds" \
            --notes "$notes"
          gh release edit demo-apk --notes "$notes"

          gh release upload demo-apk logicclass-demo-arm64.apk --clobber

          # Assets from the days of the universal and the three-way split
          # build. Left in place they would sit alongside a current arm64
          # APK looking equally fresh, and somebody would eventually
          # install a months-old 32-bit one and report a bug that was
          # fixed long ago.
          for stale in logicclass-demo.apk logicclass-demo-arm32.apk logicclass-demo-x86_64.apk; do
            gh release delete-asset demo-apk "$stale" --yes || true
          done

  # The same app as a desktop program, because a school office runs on
  # computers as much as on phones. Windows binaries can only be produced
  # on Windows, hence the separate runner rather than another step above.
  windows:
    # A desktop build nobody is waiting on between commits. Run it from
    # the Actions tab when a Windows binary is actually wanted.
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.1
          channel: stable
          cache: true

      - run: flutter pub get

      # The Firebase C++ SDK for Windows, which firebase_core pulls in and
      # unpacks at build time, declares cmake_minimum_required below 3.5.
      # CMake 4 removed compatibility with that and refuses to configure:
      #
      #   Compatibility with CMake < 3.5 has been removed from CMake.
      #
      # The file is downloaded during the build, so there is nothing in
      # this repository to fix. This is the escape hatch CMake's own error
      # message points at -- it raises the floor those old declarations
      # are treated as, rather than turning any check off.
      - run: flutter build windows --release --dart-define=DEMO_MODE=true
        env:
          CMAKE_POLICY_VERSION_MINIMUM: '3.5'

      # The whole Release folder, not just the .exe: a Flutter desktop
      # build is the executable plus its DLLs and the data/ directory, and
      # the exe alone will not start without them.
      #
      # Minus the .lib and .exp files, which are what the linker consumed
      # to produce those DLLs and are dead weight afterwards -- the
      # Firebase ones alone were 42MB, more than the rest of the download
      # put together.
      - name: Package the build
        run: |
          $src = 'build/windows/x64/runner/Release'
          Get-ChildItem $src -Recurse -Include *.lib,*.exp | Remove-Item -Force
          Compress-Archive -Path "$src/*" -DestinationPath logicclass-demo-windows.zip
        shell: pwsh

      - uses: actions/upload-artifact@v4
        with:
          name: logicclass-demo-windows
          path: app/logicclass-demo-windows.zip
          if-no-files-found: error

      - name: Publish the Windows build as a release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Runs in parallel with the APK job, so neither can assume the
          # other created the release first.
          gh release view demo-apk >/dev/null 2>&1 || gh release create demo-apk \
            --target "$GITHUB_SHA" --title "LogicClass demo builds" --notes "Build in progress."
          gh release upload demo-apk logicclass-demo-windows.zip --clobber
        shell: bash

  # iOS is compiled but not shipped, and the distinction is the point.
  #
  # The iOS project has been configured since the Android one -- bundle id
  # ph.logicclass.app, deployment target 15.0, and the camera, location
  # and photo-library usage strings iOS refuses to run without -- but it
  # had never once been compiled. "Every dependency supports iOS" is a
  # claim about pubspec.yaml; whether the thing links against all of them
  # on a real toolchain is a different question, and the only way to
  # answer it is to build.
  #
  # --no-codesign is what makes this possible without an Apple Developer
  # account: it compiles and links the whole app and stops before signing.
  # That catches the failures worth catching here -- a plugin with no iOS
  # implementation, a Swift Package that will not resolve, a deployment
  # target a dependency has outgrown -- and cannot produce anything
  # installable, which is why nothing is uploaded.
  #
  # A signed, distributable build needs an Apple Developer account, a
  # provisioning profile and GoogleService-Info.plist for real mode. When
  # those exist this job is where they plug in.
  ios:
    # Answers a question that does not change between commits: does this
    # still build for iOS. Worth asking once a release; not worth adding
    # the better part of an hour to every merge.
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    # The cap keeps a hung resolve from spending an afternoon of minutes.
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.1
          channel: stable
          cache: true

      - run: flutter pub get

      # DEMO_MODE=true for the same reason the other two jobs pass it: the
      # build must not depend on Firebase settings that are not in the
      # repository. It also means this compiles the exact configuration a
      # demo device would run.
      - run: flutter build ios --release --no-codesign --dart-define=DEMO_MODE=true

      # Says what was actually proved, so a green tick here is not mistaken
      # for an app somebody can install.
      - name: What this job did and did not prove
        run: |
          echo "iOS build compiled and linked against every plugin."
          echo "Not signed, not packaged, not installable -- that needs an"
          echo "Apple Developer account and a provisioning profile."
