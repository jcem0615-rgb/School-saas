# Builds an installable APK on GitHub's runners.
#
# This exists because the Android SDK cannot be installed everywhere the
# app can be developed -- dl.google.com is unreachable from some networks,
# and the SDK is the one part of the toolchain with no mirror. The runner
# has it preinstalled, so the APK is built where the tools already are and
# downloaded from the run's artifacts.
#
# The APK is signed with the debug key (see android/app/build.gradle.kts),
# which is what makes it installable by sideloading. It is NOT a Play Store
# build: replace the signing config with a real upload key before release.
name: Android APK

on:
  push:
    branches: [runnable-demo-mode]
    paths:
      - 'app/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      # Java 17: android/app/build.gradle.kts compiles and targets 17, and
      # the Kotlin jvmTarget is pinned to match.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.1
          channel: stable
          cache: true

      - run: flutter pub get

      # The suite is the reason to trust the binary this job hands back --
      # a green APK build only proves it compiled.
      - run: flutter test

      # DEMO_MODE is the default in main.dart, but it is passed explicitly
      # so the artifact's contents do not depend on a default changing:
      # this build must be the self-contained one that needs no Firebase
      # project behind it.
      # --split-per-abi rather than one universal APK. A universal build
      # carries native code for all three architectures and ships ~77MB to
      # a phone that can only ever run one of them; split, the arm64 build
      # every modern handset actually uses is roughly half that. The cost
      # is that the download is no longer one-size-fits-all, which is why
      # the assets below are named after the architecture.
      - run: flutter build apk --release --split-per-abi --dart-define=DEMO_MODE=true

      - uses: actions/upload-artifact@v4
        with:
          name: logicclass-demo-apk
          path: app/build/app/outputs/flutter-apk/app-*-release.apk
          if-no-files-found: error

      # Also published as a release asset, because an Actions artifact is
      # only reachable as a zip through the Actions UI -- awkward to get
      # onto the phone that is meant to install it. A release asset is a
      # direct .apk link that Android will hand straight to the installer.
      #
      # One rolling tag, clobbered each build, so the download link stays
      # the same instead of moving with every push. The repository is
      # private, so the asset is too: downloading it needs a signed-in
      # GitHub account with access.
      - name: Publish the APK as a release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          out=build/app/outputs/flutter-apk
          # Named by architecture, since the reader of the release page is
          # the person who has to pick one.
          cp "$out/app-arm64-v8a-release.apk"   logicclass-demo-arm64.apk
          cp "$out/app-armeabi-v7a-release.apk" logicclass-demo-arm32.apk
          cp "$out/app-x86_64-release.apk"      logicclass-demo-x86_64.apk

          notes=$(cat <<'TXT'
          Rolling build of the demo-mode app from the runnable-demo-mode branch.
          Debug-signed for sideloading -- not a Play Store build, and it needs
          Android 7.0 or newer (the APK carries a v2 signature only).

          Which file: **logicclass-demo-arm64.apk** for essentially any phone
          sold in the last decade. Try logicclass-demo-arm32.apk if that one
          refuses to install on an older handset. The x86_64 build is for
          emulators, not phones.
          TXT
          )
          gh release view demo-apk >/dev/null 2>&1 || gh release create demo-apk \
            --target "$GITHUB_SHA" \
            --title "LogicClass demo APK" \
            --notes "$notes"
          gh release edit demo-apk --notes "$notes"

          gh release upload demo-apk \
            logicclass-demo-arm64.apk \
            logicclass-demo-arm32.apk \
            logicclass-demo-x86_64.apk --clobber

          # The universal APK the previous build published is now stale and
          # would sit above these in the asset list, so it goes.
          gh release delete-asset demo-apk logicclass-demo.apk --yes || true
